# 通用日志配置文件
# Universal Log Configuration

# 全局日志设置
global:
  # 最大存储大小(MB)
  max_storage_mb: 50
  
  # 日志根目录
  base_dir: "logs"
  
  # 默认日志级别: DEBUG, INFO, WARN, ERROR
  default_level: "INFO"
  
  # 自动清理旧日志
  auto_cleanup: true
  
  # 检查间隔(分钟) - 多久检查一次日志大小
  cleanup_interval_minutes: 10
  
  # 禁用程序级日志，只保留topic分类日志
  disable_program_logs: true

# 各程序日志设置
programs:
  # 桥接转发器
  bridge_forwarder:
    subdir: "bridge_forwarder"
    level: "INFO"
    max_files: 20
    
  # MQTT发送器
  mqtt_sender:
    subdir: "mqtt/send"
    level: "INFO"
    max_files: 10
    
  # MQTT接收器
  mqtt_receiver:
    subdir: "mqtt/receiver"
    level: "INFO"
    max_files: 10
    
  # FastDDS订阅器
  subscriber:
    subdir: "fastdds/sub"
    level: "INFO"
    max_files: 15
    
  # FastDDS发布器
  publisher:
    subdir: "fastdds/pub"
    level: "INFO"
    max_files: 15
    
  # MQTT到FastDDS桥接器
  mqtt_to_fastdds_bridge:
    subdir: "fastdds_mqtt/mqtt_to_fastdds"
    level: "INFO"
    max_files: 15
    
  # FastDDS到MQTT桥接器  
  fastdds_to_mqtt_bridge:
    subdir: "fastdds_mqtt/fastdds_to_mqtt"
    level: "INFO"
    max_files: 15
    
  # 数据处理器
  data_processor:
    subdir: "data_processor"
    level: "INFO"
    max_files: 10
    
  # TSP转发器
  tsp_forwarder:
    subdir: "tsp_forwarder"
    level: "INFO"
    max_files: 10
    
  # MQTT模拟器
  mqtt_simulator:
    subdir: "mqtt_simulator"
    level: "INFO"
    max_files: 10

# 特殊目录设置
special_dirs:
  # 状态文件目录
  state_files:
    subdir: "mqtt"
    cleanup: false  # 状态文件不清理
    
  # 测试结果目录
  test_results:
    subdir: "mqtt/test_results"
    max_storage_mb: 20  # 测试结果单独限制
