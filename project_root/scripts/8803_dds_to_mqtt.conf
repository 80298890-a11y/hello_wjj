; TSP命令处理器 - 最优先启动的TSP命令处理服务
[program:tsp_command_processor]
command=/home/hello/work/project_root/test/build/tsp_command_processor ; TSP命令处理器可执行文件路径
directory=/home/hello/work/project_root/test/build ; 程序运行时的工作目录
user=hello ; 运行用户
autostart=true ; supervisor启动时自动启动
autorestart=true ; 程序异常退出时自动重启
priority=3 ; 最高优先级，最先启动（TSP命令处理）
startretries=30 ; 启动失败时的最大重试次数
startsecs=10 ; 启动后稳定运行时间（秒）
stdout_logfile=/var/log/supervisor/tsp_command_processor/tsp_command_processor.log ; 标准输出日志文件
stderr_logfile=/var/log/supervisor/tsp_command_processor/error/tsp_command_processor_error.log ; 标准错误日志文件
stdout_logfile_maxbytes=50MB ; 单个日志文件最大大小
stdout_logfile_backups=20 ; 保留日志文件数量
stderr_logfile_maxbytes=50MB ; 错误日志文件最大大小
stderr_logfile_backups=20 ; 保留错误日志文件数量

