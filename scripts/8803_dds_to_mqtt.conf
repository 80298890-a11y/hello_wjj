; FastDDS到MQTT桥接器 - 优先启动
[program:fastdds_to_mqtt_bridge]
command=/home/hello/work/project_root/test/build/fastdds_to_mqtt_bridge
directory=/home/hello/work/project_root/test/build
user=hello
autostart=true
autorestart=true
priority=10
startretries=30
startsecs=10
stdout_logfile=/var/log/supervisor/fastdds_to_mqtt_bridge.log
stderr_logfile=/var/log/supervisor/fastdds_to_mqtt_bridge_error.log

; FastDDS订阅器 - 后启动
[program:subscriber]
command=/home/hello/work/project_root/test/build/subscriber
directory=/home/hello/work/project_root/test/build
user=hello
autostart=true
autorestart=true
priority=20
startretries=30
startsecs=10
stdout_logfile=/var/log/supervisor/subscriber.log
stderr_logfile=/var/log/supervisor/subscriber_error.log



